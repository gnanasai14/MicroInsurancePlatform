server:
  port: 8083

spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5432/claimdb
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

odmip:
  services:
    user-service-url: http://localhost:8081
  sns:
    enabled: false                # flip to true once AWS creds + topic ARNs exist
    claim-events-topic-arn: "arn:aws:sns:us-east-1:000000000000:odmip-claim-events"
    fraud-events-topic-arn: "arn:aws:sns:us-east-1:000000000000:odmip-fraud-events"
    region: us-east-1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.odmip: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/odmip_claims
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
