server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/odmip_users
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # DEV ONLY secret - move to an env var / AWS Secrets Manager before anything
    # resembling production. Must be >= 256 bits for HS256.
    secret: "od-mip-super-secret-key-change-me-before-prod-0123456789"
    expiration-ms: 86400000   # 24h
    refresh-expiration-ms: 604800000 # 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.odmip: DEBUG

odmip:
  services:
    pricing-service-url: http://localhost:8082
  sns:
    enabled: true
    region: us-east-1
    policy-events-topic-arn: "arn:aws:sns:us-east-1:000000000000:odmip-policy-events"
  otp:
    # When false (default - no SMTP setup needed for local dev/demo), the OTP is
    # logged to this service's console instead of emailed - check the terminal
    # running user-service for a line like "OTP for jane: 482913".
    # Set true + fill in spring.mail.* above with real SMTP creds to send real emails.
    mail-enabled: false
    expiry-minutes: 10
