server:
  port: 8081

spring:
  application:
    name: user-service

  # ---- DEFAULT PROFILE = local H2, zero setup, run on day 1 ----
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # DEV ONLY secret - move to an env var / AWS Secrets Manager before anything
    # resembling production. Must be >= 256 bits for HS256.
    secret: "od-mip-super-secret-key-change-me-before-prod-0123456789"
    expiration-ms: 86400000   # 24h
    refresh-expiration-ms: 604800000 # 7d

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.odmip: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/odmip_users
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
