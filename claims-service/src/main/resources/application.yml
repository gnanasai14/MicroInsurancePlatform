server:
  port: 8083

spring:
  application:
    name: claims-service
  datasource:
    url: jdbc:postgresql://localhost:5432/claimdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

odmip:
  services:
    user-service-url: http://localhost:8081
  sns:
    enabled: true
    claim-events-topic-arn: "arn:aws:sns:us-east-1:000000000000:odmip-claim-events"
    fraud-events-topic-arn: "arn:aws:sns:us-east-1:000000000000:odmip-fraud-events"
    region: us-east-1

# Must match user-service's app.jwt.secret exactly - claims-service validates
# tokens user-service issues via the same shared HMAC key.
# DEV ONLY secret - move to an env var / AWS Secrets Manager before anything
# resembling production.
app:
  jwt:
    secret: "od-mip-super-secret-key-change-me-before-prod-0123456789"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.odmip: DEBUG

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/odmip_claims
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
