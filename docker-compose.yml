# One command to run the whole backend: `docker compose up --build`
# Starts Postgres (with the 3 databases pre-created), then all three
# services, wired to talk to each other and to Postgres by container name
# instead of localhost. The frontend still runs separately on the host
# (npm run dev) - see odmip-frontend/README.md - and reaches these services
# via the published ports below, exactly like it does without Docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: odmip-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - odmip-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./Person-A-user-service/od-mip
      dockerfile: user-service/Dockerfile
    container_name: odmip-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odmip_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ODMIP_SERVICES_PRICING_SERVICE_URL: http://pricing-service:8082
      ODMIP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  pricing-service:
    build:
      context: ./pricingServiceV2
    container_name: odmip-pricing-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odmip_pricing
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ODMIP_SERVICES_USER_SERVICE_URL: http://user-service:8081
      ODMIP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  claims-service:
    build:
      context: ./claims-service
    container_name: odmip-claims-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claimdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ODMIP_SERVICES_USER_SERVICE_URL: http://user-service:8081
      ODMIP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  odmip-pg-data:
